[package]
name = "dregg-sig-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Zero-knowledge ownership migration proofs (`zk-Hem v2`), threshold collaborative prover (`collab`), Zcash NU7 (`ZIP-2005`/`2007`, Orchard, Sapling), and durable nullifier registry"

[features]
default = ["std"]
std = [
    "dregg-sig-core/std",
    "dregg-sig-asm/std",
    "dregg-sig-accel/std",
    "dregg-sig-addr/std",
    "dregg-sig-agg/std",
    "dregg-sig-quorum/std",
]

[dependencies]
dregg-sig-core = { path = "../core", default-features = false }
dregg-sig-asm = { path = "../asm", default-features = false }
dregg-sig-accel = { path = "../accel", default-features = false }
dregg-sig-addr = { path = "../addr", default-features = false }
dregg-sig-agg = { path = "../agg", default-features = false }
dregg-sig-quorum = { path = "../quorum", default-features = false }
